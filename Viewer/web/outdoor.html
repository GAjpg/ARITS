<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="viewer-token" content="__VIEWER_TOKEN__"><title>校园地图编辑 · LiDAR 工作台</title><link rel="stylesheet" href="/assets/outdoor.css"></head><body>
<header><a href="/space">← 通行空间</a><h1>校园地图编辑</h1><span id="dirty">已保存</span><button id="import">导入地图</button><input id="file" type="file" accept=".json,application/json" hidden><button id="save">保存工作副本</button><button class="primary" id="export">导出 campus.json</button></header>
<main><section id="map"><canvas aria-label="校园地图编辑画布" tabindex="0"></canvas><div class="tools"><button data-mode="select" class="active">选择 / 移动</button><button data-mode="polygon">画楼栋</button><button data-mode="path">画步道</button><button id="undo">撤销</button><button id="redo">重做</button><button id="fit">全校</button></div><div id="hint">拖动移动，滚轮缩放；点击楼栋编辑。</div><div class="zoom"><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">−</button></div><div id="scale"></div></section>
<aside><h2>地图概况</h2><div id="summary"></div><label class="check"><input type="checkbox" id="graph" checked> 显示步行路网</label><button id="bundled">载入内置地图为草稿</button><hr><div id="empty">点击一栋楼可修改名称和显示等级。<p>画楼栋或步道时，逐点点击；按 Enter 或点击“完成绘制”。Esc 取消。</p></div><form id="properties" hidden><h2 id="selected-title">楼栋</h2><label>全称<input id="name" maxlength="120"></label><label>简称 <small>缩小时显示</small><input id="short" maxlength="60"></label><label>显示等级<select id="rank"><option value="1">1 · 较低</option><option value="2">2</option><option value="3">3 · 普通</option><option value="4">4</option><option value="5">5 · 最重要</option></select></label><p id="identity"></p><button class="primary" type="submit">应用修改</button><div class="actions"><button type="button" id="merge">与另一栋合并</button><button type="button" id="split">拆出选中部件</button><button type="button" id="delete" class="danger">删除楼栋</button></div><p id="door-hint"></p></form><section id="drawing" hidden><h2 id="drawing-title"></h2><p id="drawing-count"></p><label id="path-label">步道名称<input id="path-name" value="补充步道" maxlength="120"></label><button class="primary" id="finish">完成绘制</button><button id="cancel">取消</button></section><hr><p class="note">步道端点距现有路网 3 米内会自动接入，相交处会生成连接点。导出前检查连通性。</p><p class="note">合并保留先选楼的编号；拆出的楼使用新编号。已删除或被合并的楼需在手机建图工具中重新核实绑定。</p><div id="changes"></div></aside></main><div id="message" role="status" hidden></div><script type="module" src="/assets/outdoor.js"></script></body></html>
